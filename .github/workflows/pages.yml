# Builds the standalone app and publishes it to GitHub Pages on every push to main.
# The site is the built file twice: index.html (open it) and plane-cutter.html (download it).
name: Build and deploy

on:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: pages
  cancel-in-progress: true

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-node@v7
        with:
          node-version: 22
      - name: Test
        run: npm test
      - name: Build
        run: npm run build
      - name: Prepare the site
        run: |
          mkdir -p site
          cp dist/plane-cutter.html site/index.html
          cp dist/plane-cutter.html site/plane-cutter.html
      - uses: actions/configure-pages@v6
      - uses: actions/upload-pages-artifact@v5
        with:
          path: site

  deploy:
    needs: build
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - id: deployment
        uses: actions/deploy-pages@v5
